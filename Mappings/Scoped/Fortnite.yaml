# Menus
Alt + Mouse Left           : Enter
Alt + Mouse Right          : Esc

# Emote Wheel
\ + Q                      : Previous emote page
\ + E                      : Next emote page

# Inventory
Mouse Left (Hold .5s)      : View item info
Mouse Right                : Drop item
Mouse Middle               : Drop half

# Comms
Alt + Mouse Middle         : Mark danger
Mouse Middle + Q           : Previous comms page
Mouse Middle + E           : Next comms page
Mouse Middle + Mouse Right : Close comms

# Requests
Page Up + Q                : Previous requests page
Page Up + E                : Next requests page
Page Up + Mouse Right      : Close requests

# Mod Bench
Caps Lock + W              : Previous category
Caps Lock + S              : Next category
Caps Lock + A              : Previous part
Caps Lock + D              : Next part
Caps Lock + Mouse Left     : Buy and equip/Remove mod
Caps Lock + Mouse Right    : Exit mod bench

# Building
Mouse Forwards + E         : Repair piece
Building Mode OFF:
  Mouse Forwards + Q       : Enter building mode
  Mouse Forwards + F       : Build wall
  Mouse Forwards + X       : Build floor
  Mouse Forwards + C       : Build stair
  Mouse Forwards + V       : Build pyramid
  Mouse Forwards + Z       : Build trap
Building Mode ON:
  Q                        : Exit building mode
  Wheel Up                 : Previous material
  Wheel Down               : Next material
  F                        : Build wall
  X                        : Build floor
  C                        : Build stair
  V                        : Build pyramid
  Z                        : Build trap